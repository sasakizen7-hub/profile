<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームチャット</title>

    <!-- CSSファイルを読み込む -->
<link rel="stylesheet" href="chat.css">
</head>
<body>

    <!-- ヘッダー -->
    <header class="header">
        <h1>switchで遊べるゲームエンジョイ！</h1>
    </header>

    <!-- チャット画面 -->
    <main class="chat">

        <!-- 相手のメッセージ -->
        <div class="message left">
            <p class="name">ダブルエッグ</p>
            <div class="bubble">
                こんにちは！
            </div>
        </div>

        <!-- 自分のメッセージ -->
        <div class="message right">
            <div class="bubble">
                こんにちは！今日は何する？
            </div>
        </div>

        <!-- 相手のメッセージ -->
        <div class="message left">
            <p class="name">ダブルエッグ</p>
            <div class="bubble">
                スマブラやスプラ、マリカやろ！
            </div>
        </div>

        <!-- 自分のメッセージ -->
        <div class="message right">
            <div class="bubble">
                いいね！全部やりたい！
            </div>
        </div>

        <!-- 相手のメッセージ -->
        <div class="message left">
            <p class="name">ダブルエッグ</p>
            <div class="bubble">
                まずはスマブラから始めよう！
                そのあとスプラで遊んで、最後にマリカで勝負しよう！
            </div>
        </div>

        <!-- 自分のメッセージ -->
        <div class="message right">
            <div class="bubble">
                了解！負けないぞ！
            </div>
        </div>

    </main>

    <!-- 入力欄 -->
    <footer class="input-area">
        <input type="text" placeholder="メッセージを入力...">
        <button>送信</button>
    </footer>

</body>
